app-id: io.github.lutriscoverdownloader.App
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: lutris-cover-downloader

finish-args:
  # Read/write Lutris's data dir (pga.db, banners/, coverart/) and our own config
  - --filesystem=~/.local/share/lutris:rw
  - --filesystem=xdg-config/lutris-cover-downloader:create
  # Network access for the SteamGridDB API
  - --share=network
  # Needed to pkill/relaunch Lutris on the host from inside the sandbox
  - --talk-name=org.freedesktop.Flatpak

modules:
  # NOTE: `requests` and its dependencies (urllib3, certifi, idna, charset-normalizer)
  # need to be vendored as flatpak python modules. Generate this file locally with:
  #
  #   pip install flatpak-pip-generator   (or use the script from flatpak/flatpak-builder-tools)
  #   flatpak-pip-generator requests
  #
  # That produces python3-requests.json - drop it next to this manifest and
  # reference it below. Placeholder shown; replace with the generated content
  # or `modules: - python3-requests.json` once you have it.
  - python3-requests.json

  - name: lutris-cover-downloader
    buildsystem: simple
    build-commands:
      - install -Dm755 main.py /app/bin/lutris-cover-downloader
      - install -Dm644 core.py /app/bin/core.py
      - install -Dm644 gui.py /app/bin/gui.py
      - install -Dm644 data/io.github.lutriscoverdownloader.App.desktop /app/share/applications/io.github.lutriscoverdownloader.App.desktop
      - install -Dm644 data/io.github.lutriscoverdownloader.App.metainfo.xml /app/share/metainfo/io.github.lutriscoverdownloader.App.metainfo.xml
    sources:
      - type: dir
        path: .
